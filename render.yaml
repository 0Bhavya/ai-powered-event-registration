version: "1"
services:
  - type: web
    name: ai-event-registration
    plan: free
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-event-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DEMO_PAYMENT_MODE
        value: "True"

databases:
  - name: ai-event-db
    plan: free
    postgresMajorVersion: "15"
