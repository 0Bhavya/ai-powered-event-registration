<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/animations.css">
</head>

<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <header class="nav" role="banner">
    <div class="nav__inner container">
      <a href="/" class="nav__logo"><span>EventAI</span></a>
      <nav class="nav__links">
        <a href="/events" class="nav__link">Events</a>
        <a href="/dashboard" class="nav__link nav__link--active">Dashboard</a>
        <!-- Dynamically filled -->
      </nav>
      <button class="nav__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav__mobile" id="navMobile" hidden>
      <a href="/events">Events</a>
      <a href="/dashboard">Dashboard</a>
    </div>
  </header>
  <main class="page-content">
    <div class="container">
      <div class="section-header fade-in-up" style="text-align: left;">
        <h1 class="section-title">Welcome, <span id="userName" class="gradient-text">...</span></h1>
        <p class="section-subtitle">Manage your registrations and tickets.</p>
      </div>

      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
        <div>
          <h2 style="margin-bottom: 1rem;">My Registrations</h2>
          <div id="dashboardContainer">
            <div class="empty-state glass" id="loadingState">
              <p>Loading your dashboard...</p>
            </div>
          </div>
        </div>

        <div>
          <h2 style="margin-bottom: 1rem;">Notifications</h2>
          <div id="notificationsContainer" style="display: flex; flex-direction: column; gap: 1rem;">
            <div class="glass" style="padding: 1rem; text-align: center;">Loading...</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toastContainer" class="toast-container" role="alert" aria-live="polite"></div>

  <!-- Ticket QR Modal -->
  <div id="ticketModal" class="modal" hidden>
    <div class="modal__overlay" onclick="closeTicketModal()"></div>
    <div class="modal__content glass" style="text-align: center;">
      <h2>Event Ticket</h2>
      <p id="ticketEventName" class="text-secondary" style="margin-bottom: 1rem;"></p>
      <div
        style="background: white; padding: 1rem; display: inline-block; border-radius: var(--radius-sm); margin-bottom: 1.5rem;">
        <img id="ticketQR" src="" alt="QR Code" style="width: 200px; height: 200px;" />
      </div>
      <p>Ticket Code: <strong id="ticketCodeText" style="font-family: monospace;">...</strong></p>
      <div class="modal__actions" style="justify-content: center; margin-top: 1.5rem;">
        <button class="btn btn--primary" onclick="closeTicketModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- Feedback Modal -->
  <div id="feedbackModal" class="modal" hidden>
    <div class="modal__overlay" onclick="closeFeedbackModal()"></div>
    <div class="modal__content glass" style="max-width: 500px;">
      <h2>Submit Feedback</h2>
      <p class="text-secondary" style="margin-bottom: 1.5rem;">Tell us what you thought about this event!</p>

      <input type="hidden" id="feedbackRegId">

      <div class="form-group">
        <label class="form-label">Rating (1-5)</label>
        <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
          <label><input type="radio" name="rating" value="1"> 1</label>
          <label><input type="radio" name="rating" value="2"> 2</label>
          <label><input type="radio" name="rating" value="3"> 3</label>
          <label><input type="radio" name="rating" value="4"> 4</label>
          <label><input type="radio" name="rating" value="5" checked> 5</label>
        </div>
      </div>

      <div class="form-group">
        <label for="feedbackComment" class="form-label">Review (Optional)</label>
        <textarea id="feedbackComment" class="form-input" rows="4" placeholder="How was your experience?"></textarea>
      </div>

      <div class="modal__actions" style="justify-content: flex-end; margin-top: 1.5rem;">
        <button class="btn btn--ghost" onclick="closeFeedbackModal()">Cancel</button>
        <button class="btn btn--primary" id="submitFeedbackBtn" onclick="sendFeedback()">Submit Review</button>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!window.api.token) {
        window.location.href = '/login';
        return;
      }

      try {
        const user = await window.api.get('/auth/me');
        document.getElementById('userName').textContent = user.name;
        loadRegistrations();
        loadNotifications();
      } catch (err) {
        // Redirection handled by api.js
      }
    });

    async function loadRegistrations() {
      const container = document.getElementById('dashboardContainer');
      try {
        const regs = await window.api.get('/registrations/my-registrations');

        if (regs.length === 0) {
          container.innerHTML = `
            <div class="empty-state glass fade-in-up">
              <h1>No Registrations Found</h1>
              <p>You haven't registered for any events yet.</p>
              <a href="/events" class="btn btn--primary">Browse Events</a>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div class="events-grid">
            ${regs.map(reg => `
              <article class="event-card glass fade-in-up">
                <div class="event-card__content">
                  <div class="badge ${reg.status === 'CONFIRMED' ? '' : 'badge--demo'}">${reg.status}</div>
                  <h3 class="event-card__title">Event ID: ${reg.event_id}</h3>
                  <p class="event-card__desc">Registration Code: ${reg.registration_code}</p>
                  
                  <div class="event-card__footer" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    ${reg.status === 'CONFIRMED'
            ? `<button class="btn btn--primary" style="flex: 1;" onclick="viewTicket(${reg.id})">View Ticket</button>
                         <button class="btn btn--ghost" style="flex: 1;" onclick="openFeedbackModal(${reg.id})">Feedback</button>`
            : `<p class="text-secondary" style="font-size: 0.85rem;">Ticket unavailable</p>`
          }
                  </div>
                </div>
              </article>
            `).join('')}
          </div>
        `;
      } catch (err) {
        container.innerHTML = '<div class="empty-state glass"><p>Failed to load registrations.</p></div>';
        window.EventAI.showToast(err.message, 'error');
      }
    }

    async function viewTicket(regId) {
      try {
        const ticket = await window.api.get(`/tickets/registration/${regId}`);
        document.getElementById('ticketEventName').textContent = 'Registration ID: ' + regId;
        document.getElementById('ticketCodeText').textContent = ticket.ticket_code;
        document.getElementById('ticketQR').src = '/api/tickets/' + ticket.id + '/qr';
        document.getElementById('ticketModal').removeAttribute('hidden');
      } catch (err) {
        window.EventAI.showToast("Could not load ticket.", "error");
      }
    }

    function closeTicketModal() {
      document.getElementById('ticketModal').setAttribute('hidden', '');
    }

    async function loadNotifications() {
      const container = document.getElementById('notificationsContainer');
      try {
        const notifs = await window.api.get('/notifications');
        if (notifs.length === 0) {
          container.innerHTML = '<div class="glass" style="padding: 1rem; text-align: center; color: var(--text-secondary);">No notifications yet.</div>';
          return;
        }

        container.innerHTML = notifs.map(n => `
          <div class="glass" style="padding: 1rem; border-left: 4px solid var(--accent-purple);">
            <div style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.25rem;">
              ${new Date(n.created_at).toLocaleString()}
            </div>
            <div style="font-weight: 500;">${n.type.replace(/_/g, ' ')}</div>
            <div style="font-size: 0.9rem; margin-top: 0.5rem;">
              Status: <span class="badge ${n.status === 'SENT' ? '' : 'badge--demo'}">${n.status}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<div class="glass" style="padding: 1rem; text-align: center; color: var(--accent-red);">Failed to load.</div>';
      }
    }

    function openFeedbackModal(regId) {
      document.getElementById('feedbackRegId').value = regId;
      document.getElementById('feedbackComment').value = '';
      document.getElementById('feedbackModal').removeAttribute('hidden');
    }

    function closeFeedbackModal() {
      document.getElementById('feedbackModal').setAttribute('hidden', '');
    }

    async function sendFeedback() {
      const regId = document.getElementById('feedbackRegId').value;
      const rating = document.querySelector('input[name="rating"]:checked').value;
      const comment = document.getElementById('feedbackComment').value.trim();
      const btn = document.getElementById('submitFeedbackBtn');

      try {
        btn.disabled = true;
        btn.textContent = 'Submitting...';

        await window.api.post('/feedback', {
          registration_id: parseInt(regId),
          rating: parseInt(rating),
          comment: comment
        });

        window.EventAI.showToast('Thank you for your feedback! The AI analyzed your sentiment.', 'success');
        closeFeedbackModal();
      } catch (err) {
        window.EventAI.showToast(err.message || 'Failed to submit feedback', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit Review';
      }
    }
  </script>
</body>

</html>
