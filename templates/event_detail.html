<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ event.title }} — {{ app_name }}</title>
  <meta name="description" content="{{ event.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/animations.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <header class="nav" role="banner">
    <div class="nav__inner container">
      <a href="/" class="nav__logo"><span>EventAI</span></a>
      <nav class="nav__links">
        <a href="/events" class="nav__link">Events</a>
        <a href="/dashboard" class="nav__link">Dashboard</a>
      </nav>
      <button class="nav__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>
  
  <main class="page-content">
    <div class="container" style="max-width: 800px;">
      <div class="glass fade-in-up" style="padding: 2.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
          <div>
            <div class="badge" style="margin-bottom: 1rem;">{{ event.status }}</div>
            <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--text-primary);">{{ event.title }}</h1>
            <p class="text-secondary" style="font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              {{ event.event_date }} | {{ event.start_time }}
            </p>
            <p class="text-secondary" style="font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem; margin-top: 0.25rem;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
              {{ event.venue }}
            </p>
          </div>
          
          <div style="text-align: right; background: rgba(255,255,255,0.02); padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);">
            <p style="font-size: 2rem; font-weight: 700; color: var(--accent-purple); margin-bottom: 0.25rem;">₹{{ event.ticket_price }}</p>
            <p class="text-secondary" style="font-size: 0.9rem; margin-bottom: 1rem;">{{ event.available_seats }} / {{ event.capacity }} seats left</p>
            <button class="btn btn--primary btn--glow" onclick="initiateRegistration()" style="width: 100%;">Register Now</button>
          </div>
        </div>
        
        <hr style="border: 0; border-top: 1px solid var(--border-subtle); margin: 2.5rem 0;">
        
        <div style="line-height: 1.8; color: var(--text-secondary);">
          <h2 style="color: var(--text-primary); margin-bottom: 1rem;">About This Event</h2>
          <p>{{ event.description }}</p>
        </div>
      </div>
    </div>
  </main>
  
  <div id="toastContainer" class="toast-container" role="alert" aria-live="polite"></div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/main.js"></script>
  <script>
    function initiateRegistration() {
      // In a real app, this would redirect to checkout or open the checkout modal
      // We will redirect back to the events page and open the modal by triggering a query param or just simple redirect
      window.location.href = "/events?register=" + {{ event.id }};
    }
  </script>
</body>
</html>
