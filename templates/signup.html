<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/animations.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <main class="auth-page">
    <div class="auth-card glass fade-in-up">
      <a href="/" class="auth-card__back">&larr; Home</a>
      <h1>Create your account</h1>
      <p class="auth-card__subtitle">Join to start registering for events.</p>
      
      <form id="signupForm" class="auth-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" class="form-input" required placeholder="Jane Doe">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="form-input" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" required minlength="8" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn--primary btn--full btn--glow" id="signupBtn">
          <span>Create Account</span>
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center;">
        <a href="/login" class="btn btn--secondary btn--full">Already have an account?</a>
      </div>
    </div>
  </main>
  
  <div id="toastContainer" class="toast-container" role="alert" aria-live="polite"></div>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
