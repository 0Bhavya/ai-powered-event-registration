<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events — {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/animations.css">
</head>

<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <header class="nav" role="banner">
    <div class="nav__inner container">
      <a href="/" class="nav__logo"><span>EventAI</span></a>
      <nav class="nav__links">
        <a href="/events" class="nav__link nav__link--active">Events</a>
        <a href="/login" class="nav__link">Login</a>
        <a href="/signup" class="nav__link nav__link--cta">Create Account</a>
      </nav>
      <button class="nav__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav__mobile" id="navMobile" hidden>
      <a href="/events">Events</a>
      <a href="/login">Login</a>
      <a href="/signup">Create Account</a>
    </div>
  </header>
  <main class="page-content">
    <div class="container">
      <div class="section-header fade-in-up">
        <h1 class="section-title">Upcoming <span class="gradient-text">Events</span></h1>
        <p class="section-subtitle">Secure your spot at the frontier of innovation.</p>
      </div>

      <div id="eventsContainer" class="events-grid">
        <div class="empty-state glass" id="loadingState">
          <p>Loading events...</p>
        </div>
      </div>
    </div>
  </main>

  <div id="toastContainer" class="toast-container" role="alert" aria-live="polite"></div>

  <!-- Registration/Payment Modal -->
  <div id="paymentModal" class="modal" hidden>
    <div class="modal__overlay" onclick="closePaymentModal()"></div>
    <div class="modal__content glass">
      <h2>Complete Registration</h2>
      <p id="modalEventName" class="text-secondary"></p>
      <div class="modal__price-tag">
        <span>Total Due</span>
        <strong id="modalEventPrice"></strong>
      </div>
      <p class="modal__demo-note">Demo Mode: Payment will be simulated automatically.</p>
      <div class="modal__actions">
        <button class="btn btn--secondary" onclick="closePaymentModal()">Cancel</button>
        <button class="btn btn--primary btn--glow" id="confirmPaymentBtn" onclick="processPayment()">Confirm &
          Pay</button>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/main.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    let currentRegistrationId = null;

    async function loadEvents() {
      const container = document.getElementById('eventsContainer');
      try {
        const events = await window.api.get('/events');
        if (events.length === 0) {
          container.innerHTML = '<div class="empty-state glass"><p>No events available right now.</p></div>';
          return;
        }

        container.innerHTML = events.map(evt => `
          <article class="event-card glass fade-in-up">
            <a href="/event/${evt.slug}" style="text-decoration: none;">
              ${evt.banner_image ? `<img src="${evt.banner_image}" alt="${evt.title}" class="event-card__img">` : '<div class="event-card__img-placeholder"></div>'}
            </a>
            <div class="event-card__content">
              <div class="event-card__meta">
                <span>${new Date(evt.event_date).toLocaleDateString()}</span>
                <span>•</span>
                <span>${evt.venue}</span>
              </div>
              <a href="/event/${evt.slug}" style="text-decoration: none; color: inherit;">
                <h3 class="event-card__title">${evt.title}</h3>
              </a>
              <p class="event-card__desc">${evt.description || 'No description provided.'}</p>
              
              <div class="event-card__footer">
                <div class="event-card__price">${evt.ticket_price > 0 ? '₹' + evt.ticket_price : 'Free'}</div>
                <button class="btn btn--primary" onclick="startRegistration(${evt.id}, '${evt.title}', ${evt.ticket_price})" ${evt.available_seats <= 0 ? 'disabled' : ''}>
                  ${evt.available_seats > 0 ? 'Register Now' : 'Sold Out'}
                </button>
              </div>
            </div>
          </article>
        `).join('');

        // Check for ?register=ID param
        const urlParams = new URLSearchParams(window.location.search);
        const registerId = urlParams.get('register');
        if (registerId) {
          const evt = events.find(e => e.id == registerId);
          if (evt) {
            startRegistration(evt.id, evt.title, evt.ticket_price);
            // clean url
            window.history.replaceState({}, document.title, "/events");
          }
        }
      } catch (err) {
        container.innerHTML = '<div class="empty-state glass"><p>Failed to load events.</p></div>';
        window.EventAI.showToast(err.message, 'error');
      }
    }

    async function startRegistration(eventId, title, price) {
      if (!window.api.token) {
        window.EventAI.showToast('Please login to register for events', 'info');
        setTimeout(() => window.location.href = '/login', 1500);
        return;
      }

      try {
        // 1. Check availability
        await window.api.post('/registrations/check', { event_id: eventId });

        // 2. Create pending registration
        const reg = await window.api.post('/registrations', { event_id: eventId });

        if (reg.status === 'BLOCKED') {
          window.EventAI.showToast('Registration blocked due to high fraud risk.', 'error', 6000);
          return;
        }

        currentRegistrationId = reg.id;

        // 3. Open Payment Modal
        document.getElementById('modalEventName').textContent = title;
        document.getElementById('modalEventPrice').textContent = price > 0 ? '₹' + price : 'Free';
        document.getElementById('paymentModal').removeAttribute('hidden');

      } catch (err) {
        window.EventAI.showToast(err.message, 'error');
      }
    }

    function closePaymentModal() {
      document.getElementById('paymentModal').setAttribute('hidden', '');
      currentRegistrationId = null;
    }

    async function processPayment() {
      if (!currentRegistrationId) return;
      const btn = document.getElementById('confirmPaymentBtn');

      try {
        btn.disabled = true;
        btn.innerHTML = 'Processing...';

        // 1. Create order
        const order = await window.api.post('/payments/create-order', { registration_id: currentRegistrationId });

        if (order.demo_mode) {
          // 2. Verify payment (Simulate success in demo mode)
          const verifyData = {
            razorpay_order_id: order.order_id,
            razorpay_payment_id: "pay_demo_" + Math.random().toString(36).substring(7),
            razorpay_signature: "demo_sig_valid"
          };
          await window.api.post('/payments/verify', verifyData);

          window.EventAI.showToast('Payment successful! Ticket generated.', 'success');
          closePaymentModal();
          setTimeout(() => window.location.href = '/dashboard', 1500);
        } else {
          // 3. Open real Razorpay Checkout
          const options = {
            key: order.key_id,
            amount: order.amount * 100, // Razorpay expects paise
            currency: order.currency,
            name: "EventAI Registration",
            description: "Ticket Payment",
            order_id: order.order_id,
            handler: async function (response) {
              try {
                window.EventAI.showToast('Verifying payment...', 'info');
                await window.api.post('/payments/verify', {
                  razorpay_order_id: response.razorpay_order_id,
                  razorpay_payment_id: response.razorpay_payment_id,
                  razorpay_signature: response.razorpay_signature
                });
                window.EventAI.showToast('Payment successful! Ticket generated.', 'success');
                closePaymentModal();
                setTimeout(() => window.location.href = '/dashboard', 1500);
              } catch (verifyErr) {
                window.EventAI.showToast(verifyErr.message || 'Verification failed', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Confirm & Pay';
              }
            },
            prefill: {
              name: "Attendee",
              email: "attendee@example.com"
            },
            theme: {
              color: "#6366f1"
            }
          };
          const rzp = new window.Razorpay(options);
          rzp.on('payment.failed', function (response) {
            window.EventAI.showToast(response.error.description, 'error');
            btn.disabled = false;
            btn.innerHTML = 'Confirm & Pay';
          });
          rzp.open();
        }

      } catch (err) {
        window.EventAI.showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = 'Confirm & Pay';
      }
    }

    document.addEventListener('DOMContentLoaded', loadEvents);
  </script>
</body>

</html>
