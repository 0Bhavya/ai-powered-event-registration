<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Manage Events — {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/animations.css">
  <style>
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 1rem; border-bottom: 1px solid var(--border-subtle); }
    th { color: var(--text-secondary); font-weight: 500; }
    .action-btn { background: none; border: none; cursor: pointer; padding: 0.5rem; margin-right: 0.25rem; font-size: 0.85rem; border-radius: 4px; }
    .action-btn--delete { color: var(--accent-red); background: rgba(239, 68, 68, 0.1); }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <header class="nav" role="banner">
    <div class="nav__inner container">
      <a href="/" class="nav__logo"><span>EventAI Admin</span></a>
      <nav class="nav__links">
        <a href="/admin" class="nav__link">Dashboard</a>
        <a href="/admin/events" class="nav__link nav__link--active">Events</a>
        <a href="/admin/registrations" class="nav__link">Registrations</a>
        <a href="/admin/feedback" class="nav__link">Feedback</a>
        <button class="nav__link nav__link--cta" onclick="window.api.clearAuth(); window.location.href='/'">Logout</button>
      </nav>
    </div>
  </header>
  
  <main class="page-content">
    <div class="container">
      <div class="section-header fade-in-up" style="display: flex; justify-content: space-between; align-items: flex-end;">
        <div>
          <h1 class="section-title" style="margin-bottom: 0;">Manage <span class="gradient-text">Events</span></h1>
        </div>
        <button class="btn btn--primary btn--glow" onclick="openCreateEventModal()">+ Create Event</button>
      </div>

      <div class="glass fade-in-up" style="padding: 1.5rem; margin-top: 2rem;">
        <table id="eventsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Date</th>
              <th>Capacity</th>
              <th>Price</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="7" style="text-align: center;">Loading events...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  
  <div id="toastContainer" class="toast-container" role="alert" aria-live="polite"></div>

  <!-- Create Event Modal -->
  <div id="createEventModal" class="modal" hidden>
    <div class="modal__overlay" onclick="closeCreateEventModal()"></div>
    <div class="modal__content glass" style="max-width: 600px; text-align: left;">
      <h2>Create New Event</h2>
      <p class="text-secondary" style="margin-bottom: 1.5rem;">Fill out the details below to publish a new event.</p>
      
      <form id="createEventForm" onsubmit="submitCreateEvent(event)">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <div class="form-group">
            <label class="form-label">Title</label>
            <input type="text" id="evTitle" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">URL Slug</label>
            <input type="text" id="evSlug" class="form-input" required placeholder="e.g. ai-summit-2026">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label class="form-label">Venue</label>
          <input type="text" id="evVenue" class="form-input" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <div class="form-group">
            <label class="form-label">Date</label>
            <input type="date" id="evDate" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Start Time</label>
            <input type="time" id="evStart" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">End Time</label>
            <input type="time" id="evEnd" class="form-input" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <div class="form-group">
            <label class="form-label">Capacity</label>
            <input type="number" id="evCapacity" class="form-input" required min="1">
          </div>
          <div class="form-group">
            <label class="form-label">Ticket Price (₹)</label>
            <input type="number" id="evPrice" class="form-input" required min="0" step="0.01">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label">Description</label>
          <textarea id="evDesc" class="form-input" rows="3"></textarea>
        </div>

        <div class="modal__actions" style="justify-content: flex-end;">
          <button type="button" class="btn btn--ghost" onclick="closeCreateEventModal()">Cancel</button>
          <button type="submit" class="btn btn--primary" id="btnSubmitEvent">Publish Event</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!window.api.token) {
        window.location.href = '/login';
        return;
      }
      
      try {
        const user = await window.api.get('/auth/me');
        if (user.role !== 'ADMIN') {
          window.EventAI.showToast('Access denied. Admins only.', 'error');
          setTimeout(() => window.location.href = '/dashboard', 1500);
          return;
        }
        loadEvents();
      } catch (err) {
        // Redirect handled by api.js
      }
    });

    async function loadEvents() {
      const tbody = document.querySelector('#eventsTable tbody');
      try {
        const events = await window.api.get('/events');
        if (events.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No events found.</td></tr>';
          return;
        }
        
        tbody.innerHTML = events.map(e => `
          <tr>
            <td>${e.id}</td>
            <td><strong>${e.title}</strong><br><small class="text-secondary">${e.slug}</small></td>
            <td>${e.event_date}</td>
            <td>${e.available_seats} / ${e.capacity}</td>
            <td>₹${e.ticket_price.toFixed(2)}</td>
            <td>${e.status}</td>
            <td>
              <button class="action-btn action-btn--delete" onclick="deleteEvent(${e.id})">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--accent-red);">Failed to load events.</td></tr>';
      }
    }

    async function deleteEvent(id) {
      if (!confirm("Are you sure you want to delete this event? This action cannot be undone.")) return;
      
      try {
        await window.api.delete('/events/' + id);
        window.EventAI.showToast('Event deleted successfully.', 'success');
        loadEvents();
      } catch (err) {
        window.EventAI.showToast(err.message || 'Failed to delete event', 'error');
      }
    }

    function openCreateEventModal() {
      document.getElementById('createEventForm').reset();
      document.getElementById('createEventModal').removeAttribute('hidden');
    }

    function closeCreateEventModal() {
      document.getElementById('createEventModal').setAttribute('hidden', '');
    }

    async function submitCreateEvent(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitEvent');
      btn.disabled = true;
      btn.textContent = 'Publishing...';

      try {
        const payload = {
          title: document.getElementById('evTitle').value,
          slug: document.getElementById('evSlug').value,
          venue: document.getElementById('evVenue').value,
          event_date: document.getElementById('evDate').value,
          start_time: document.getElementById('evStart').value + ":00",
          end_time: document.getElementById('evEnd').value + ":00",
          capacity: parseInt(document.getElementById('evCapacity').value),
          ticket_price: parseFloat(document.getElementById('evPrice').value),
          description: document.getElementById('evDesc').value,
          status: "PUBLISHED"
        };
        
        await window.api.post('/events', payload);
        window.EventAI.showToast('Event created successfully!', 'success');
        closeCreateEventModal();
        loadEvents();
      } catch (err) {
        window.EventAI.showToast(err.message || 'Failed to create event', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Publish Event';
      }
    }
  </script>
</body>
</html>
